# Sites scannés par le mode « catalogue » : enseignes françaises reconnues
# (ou leur boutique officielle). Aucune plateforme de particuliers ici.
#
# kind = "enseigne"    : le site vend lui-même ses produits.
# kind = "marketplace" : le site accueille aussi des revendeurs tiers ;
#                        `sellers` liste les seuls vendeurs acceptés (en général
#                        l'enseigne elle-même). Une offre d'un autre vendeur est ignorée.
# path_prefix          : ne garder que les pages de cette section (sites multi-pays).
# start_urls           : pages de départ en plus du plan du site (sitemap).
# enabled = false      : désactivé par défaut (voir `note`).
#
# Pour ajouter un site : copiez un bloc. Pour en couper un sans modifier ce
# fichier : `disabled_sites = ["fnac.com"]` dans config.toml.

