# Configuration du bot Vinted : copie ce fichier en "config.toml" puis adapte-le.

[general]
domaine = "www.vinted.fr"          # ou www.vinted.be, www.vinted.es, …
intervalle_minutes = 5             # temps entre deux passages (ne descends pas trop bas)
pause_entre_requetes = [2.0, 5.0]  # pause aléatoire (secondes) entre deux appels à Vinted
base_de_donnees = "vinted_bot.db"
historique_jours = 30              # durée de mémoire des prix pour estimer le marché

# Critères par défaut, appliqués à toutes les recherches (chaque recherche peut les remplacer)
[criteres]
remise_min = 0.35            # alerte si le coût réel est au moins 35 % sous le prix du marché
benefice_min = 10            # … ET si la marge estimée dépasse 10 €
percentile_reference = 40    # 50 = prix médian ; 40 = plus prudent (les annonces trop chères
                             # restent en ligne plus longtemps et gonflent la médiane)
comparables_min = 15         # nombre minimum d'annonces similaires pour faire confiance au prix
frais_livraison_achat = 3.5  # livraison que tu paies à l'achat (en €)
frais_envoi_revente = 0      # en France, c'est l'acheteur qui paie le port à la revente
commission_revente = 0       # 0 sur Vinted (vendeur) ; 0.1 si tu revends ailleurs avec 10 % de frais
ratio_suspect = 0.2          # prix < 20 % du marché → alerte marquée "suspecte"
# Vendeur : les profils sans vente ou sans avis sont écartés (mettre 0 pour désactiver)
vendeur_ventes_min = 5       # nombre minimum d'articles déjà vendus
vendeur_avis_min = 1         # nombre minimum d'évaluations reçues
vendeur_note_min = 4         # note minimale sur 5 ; 0 = pas de condition
mots_exclus = [
  "cassé", "casse", "pour pièces", "hs", "ne fonctionne pas", "défaut",
  "boîte vide", "boite vide", "réplique", "replica", "copie", "contrefaçon",
  "lot", "échange", "recherche",
]

# ─── Surveillance de TOUT Vinted ───────────────────────────────────────────────
# Le bot lit en continu les nouvelles annonces de tout le site, sans mots-clés. Il compare
# chaque article aux annonces de la même marque, au titre proche et du même type (des
# chaussettes Nike ne sont jamais comparées à des baskets Nike). Il apprend les prix au fil
# du temps : les premières heures, il y a peu d'alertes, puis de plus en plus.
[flux]
actif = true
intervalle_secondes = 30     # lecture des nouveautés toutes les ~30 s
pages_max = 3                # jusqu'à 3 × 96 annonces par lecture si le site publie vite
historique_jours = 10        # mémoire des prix (quelques centaines de Mo, jusqu'à ~1,5 Go)
ignorer_sans_marque = true   # les articles sans marque se revendent mal et se comparent mal
alertes_max_par_heure = 30   # garde-fou contre l'avalanche de notifications
prix_min = 2                 # les annonces à 1 € sont souvent des leurres ; le bénéfice_min
                             # suffit à écarter les petits articles sans marge
benefice_min = 15            # tous les réglages de [criteres] peuvent être remplacés ici
comparables_min = 10

# ─── Leboncoin : toute la France, annonces avec livraison uniquement ───────────
# Leboncoin est très protégé contre les robots (DataDome) : le bot y va doucement, une
# lecture par recherche toutes les ~10 minutes. Garde un petit nombre de recherches
# précises. Pas de nombre de ventes sur Leboncoin : le filtre vendeur exige à la place
# autant d'avis que de ventes (5 avis et 4/5 minimum avec les réglages ci-dessus).
[leboncoin]
actif = true
livraison_uniquement = true      # uniquement les annonces expédiables, partout en France
intervalle_minutes = 10          # ne descends pas en dessous de 5
pause_entre_requetes = [4.0, 9.0]
frais_livraison_achat = 6        # utilisé seulement si l'annonce n'indique pas son port :
                                 # sinon le bot prend les vrais frais (protection + port le moins cher)
# tous les réglages de [criteres] peuvent être remplacés ici ou dans chaque recherche

# Le plus simple : fais ta recherche sur leboncoin.fr (catégorie, mots, prix…), puis
# copie l'URL dans "url". La localisation de l'URL est ignorée : toute la France.
[[leboncoin.recherches]]
nom = "Switch OLED"
mots_cles = "switch oled"
prix_min = 120
mots_exclus = ["coque", "housse", "étui", "jeu", "jeux", "manette", "boîte seule", "dock seul"]
remise_min = 0.25
benefice_min = 30

[[leboncoin.recherches]]
nom = "AirPods Pro"
mots_cles = "airpods pro"
prix_min = 60
mots_exclus = ["boîtier seul", "boitier seul", "écouteur seul", "ecouteur seul", "coque", "faux"]
remise_min = 0.3
benefice_min = 25

[[leboncoin.recherches]]
nom = "Lego Star Wars"
mots_cles = "lego star wars"
prix_min = 30
mots_exclus = ["incomplet", "figurine seule", "notice seule", "compatible"]
actif = false                    # mettre à true pour l'activer

[notifications]
console = true
# Telegram (recommandé, alertes sur ton téléphone) : voir le README
telegram_token = ""
telegram_chat_id = ""
# Discord : Paramètres du salon > Intégrations > Webhooks > Copier l'URL
discord_webhook = ""

# ─── Recherches ciblées (facultatives, en plus du flux) ────────────────────────
# Utile pour suivre de près un article précis : le prix de référence y est plus fiable.
# Le plus simple : fais ta recherche sur vinted.fr avec les filtres (catégorie, marque,
# taille, état…), puis copie l'URL de la page dans "url".
# Conseil : plus la recherche est précise (catégorie + marque), plus le prix de
# référence est fiable. Une recherche "iphone" mélange coques et téléphones !

[[recherches]]
nom = "Nike Dunk Low"
url = "https://www.vinted.fr/catalog?search_text=nike%20dunk%20low"
prix_min = 20                # écarte accessoires, lacets…
prix_max = 90
mots_requis = ["dunk"]       # le titre doit contenir ces mots
mots_exclus = ["enfant", "bébé"]
actif = false                # mettre à true pour l'activer

[[recherches]]
nom = "Nintendo Switch OLED"
mots_cles = "switch oled"
prix_min = 100
mots_exclus = ["coque", "housse", "protection", "jeu", "manette", "boîte seule"]
remise_min = 0.25            # sur l'électronique, -25 % est déjà intéressant
benefice_min = 30
actif = false

[[recherches]]
nom = "Ralph Lauren pull"
url = "https://www.vinted.fr/catalog?search_text=ralph%20lauren%20pull"
prix_max = 40
actif = false                # mettre à true pour l'activer
